# Copyright 2026 davenonymous
#
# sourcepawn-tools: pawncritic, a policy-based linter, and pawntidy, a
# formatter, for SourcePawn. See README.md.

[workspace]
members = ["crates/pawn-core", "crates/pawncritic", "crates/pawntidy"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"
authors = ["davenonymous <dave@davenonymous.com>"]
publish = false

[workspace.dependencies]
pawn-core = { path = "crates/pawn-core" }
pawntidy = { path = "crates/pawntidy" }
anstream = "1"
anstyle = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
ignore = "0.4.34"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tempfile = "3"
thiserror = "2"
toml = "1"
tree-sitter = "0.26"
tree-sitter-sourcepawn = "0.8.0"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
